[project]
name = "esa-consulting"
version = "0.1.0"
description = "Consulting Project on Substance Abuse Analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle>=3.1.2",
    "gapstat",
    "graphviz>=0.21",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jinja2>=3.1.6",
    "miceforest>=6.0.3",
    "networkx>=3.5",
    "pandas>=2.3,<3",
    "plotnine>=0.16.0a1",
    "pymc>=5.24.0",
    "radian>=0.6.15",
    "stepmix>=2.2.3",
    "umap-learn>=0.5.7",
    "validclust>=0.1.1",
    "vl-convert-python>=1.8.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pandas-stubs==2.3.3.*",
    "ruff>=0.15.20",
    "ty>=0.0.72",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", # pycodestyle Error
    "F", # Pyflakes
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "C4", # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # let the formatter handle line length where possible
    "B007", # allow named unused variables in expressions that are looped over
    "B023", # allow function definitions with loop variables
    "PIE804", # allow constructing and immediately unpacking dictionary
    "RUF001", # allow ambiguous unicode characters in strings
    "RUF002", # allow ambiguous unicode characters in docstrings
    "RUF003", # allow ambiguous unicode characters in comments
    "RUF059", # allow assigning named unused variable when unpacking
]

fixable = ["ALL"]
unfixable = [
    "F401", # don't auto-fix unused imports
]

[tool.uv.sources]
gapstat = { git = "https://github.com/jmmaloney3/gapstat.git" }
