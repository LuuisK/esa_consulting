[project]
name = "esa-consulting"
version = "0.1.0"
description = "Consulting Project on Substance Abuse Analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gapstat",
    "graphviz>=0.21",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "miceforest>=6.0.3",
    "networkx>=3.5",
    "pandas>=2.3.0",
    "plotnine>=0.16.0a1",
    "pymc>=5.24.0",
    "radian>=0.6.15",
    "stepmix>=2.2.3",
    "umap-learn>=0.5.7",
    "validclust>=0.1.1",
    "vl-convert-python>=1.8.0",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"] # A subset of the pycodestyle (`E`) codes, Pyflakes (`F`), and isort (`I`)
ignore = []

fixable = ["ALL"]
unfixable = ["E401", "F401"] # Don't auto-fix multiple-imports-on-one-line (`E401`) and unused-import (`F401`) errors

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.uv.sources]
gapstat = { git = "https://github.com/jmmaloney3/gapstat.git" }
